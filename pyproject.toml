[build-system]
requires = [ "setuptools>=61.2" ]
build-backend = "setuptools.build_meta"

[project]
name = "minqlx_plugin_tests"
version = "0.0.1"
authors = [{name = "Markus 'ShiN0' Gaertner"}]
license = {text = "BSD-3-Clause"}
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.8"
dependencies = [
    "pre-commit>=3.5",
    "pyzmq>=27.1.0",
    "redis>=2.10,<7; python_version < '3.9'",
    "redis>=2.10,<8; python_version >= '3.9' and python_version < '3.10'",
    "redis>=2.10; python_version >= '3.10'",
    "urllib3>=1.24.3",
    "requests>=2.20",
    "aiohttp>=3.7.4,<3.11; python_version < '3.9'",
    "aiohttp>=3.7.4,<3.14; python_version == '3.9'",
    "aiohttp>=3.7.4; python_version >= '3.10'",
    "aiohttp-retry>=2.4",
    "discord.py>=2.0; python_version >= '3.8'",
    "schedule>=1.2.2; python_version >= '3.8'",
    "openai>=1.2.0,<2.3; python_version < '3.9'",
    "openai>=1.2.0,<3; python_version >= '3.9' and python_version < '3.10'",
    "openai>=1.2.0; python_version >= '3.10'",
    "tiktoken>=0.3.0,<0.8; python_version < '3.9'",
    "tiktoken>=0.8.0; python_version >= '3.9'",
    "emoji>=2.2.0",
    "psutil>=5.9.5",
    "distro>=1.8.0",
    "humanize>=4.6.0",
]

[project.optional-dependencies]
tests = [
    "redis>=3.0",
    "pytest>=7.0.1,<8.4.2; python_version < '3.9'",
    "pytest>=8.4.2; python_version >= '3.9'",
    "pytest-asyncio>=0.24; python_version >= '3.8'",
    "pytest-clarity>=1.0.0",
    "PyHamcrest>=2.1.0",
    "mockito>=2.0",
    "undecorated>=0.1.0"
]
coverage = [
    "minqlx_plugin_tests[tests]",
    "pytest-cov>=5.0,<6.0; python_version < '3.9'",
    "pytest-cov>=7.0; python_version >= '3.9'",
]
ruff = [ "ruff>=0.17" ]
mypy = [
    "mypy>=1.14,<1.20; python_version < '3.9'",
    "mypy>=1.19,<2; python_version == '3.9'",
    "mypy>=1.20; python_version >= '3.10'",
    "types-redis>=4.3",
    "types-requests>=2.32,<2.33; python_version < '3.9'",
    "types-requests>=2.32.4,<2.33; python_version == '3.9'",
    "types-requests>=2.33; python_version >= '3.10'",
]
ty = [ "ty>=0.0.91" ]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/mgaertne/minqlx-plugin-tests"

[tool.setuptools]
license-files = ["LICENSE"]
include-package-data = false

[tool.setuptools.packages]
find = {namespaces = false}

[tool.tox]
requires = [ "tox>=4.21,<5", "tox-gh-actions>=3.2,<4", "tox-uv>=1.13,<1.14" ]
env_list = [ "py38", "py39", "py310", "py311", "py312", "py313", "py314", "py315", "coverage", "ruff", "mypy", "ty" ]
use_develop = true

[tool.tox.gh-actions]
python = """
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
"""

[tool.tox.env_run_base]
extras = [ "tests" ]
commands = [["pytest", { replace = "posargs", default = [], extend = true }]]

[tool.tox.env.coverage]
extras = [ "coverage" ]
commands = [
    ["pytest", "--cov=src", "--cov-report=", { replace = "posargs", default = ["tests"], extend = true }],
    ["coverage", "report", "--omit=src/minqlx/*,src/experimental/*,tests/*", "--fail-under=90"],
    ["coverage", "report", "--include=src/experimental/*"],
    ["coverage", "xml"],
    ["coverage", "html"],
]

[tool.tox.env.ruff]
extras = [ "ruff" ]
commands = [
    ["ruff", "check", { replace = "posargs", default = ["src", "stubs", "tests"], extend = true }],
    ["ruff", "format", "--check", { replace = "posargs", default = ["src", "stubs", "tests"], extend = true }],
]

[tool.tox.env.ty]
extras = [ "ty" ]
commands = [[ "ty", "check", { replace = "posargs", default = [], extend = true }]]

[tool.tox.env.mypy]
extras = [ "mypy" ]
commands = [[ "mypy", { replace = "posargs", default = [], extend = true }]]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "src",
    "tests",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:discord.player",
]

[tool.coverage.paths]
source = [
    "src"
]

[tool.coverage.run]
omit = [
    "src/minqlx/*",
    "tests/*",
    "tests/minqlx_plugin_test/*",
]

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "venv",
]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["B", "C4", "C40", "E", "F", "I", "PERF", "PIE", "RUF", "SIM", "TCH", "UP"]
ignore = ["UP006"] # `type[...]` is unavailable at runtime on Python 3.8.
fixable = [
    "B", "C", "COM", "E", "F", "FA", "FAST", "FLY", "I", "ICN", "ISC", "NPY",
    "PD", "PERF", "PIE", "PT", "Q", "RET", "RSE", "SIM", "TC", "TID", "UP",
]
unfixable = []
per-file-ignores = {}
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
mccabe.max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.environment]
extra-paths = ["stubs"]
python-version = "3.8"
root = ["src"]

[tool.ty.src]
include = ["src"]
exclude = ["src/minqlx/**"]

[tool.mypy]
packages = ["stubs","src","tests"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "stubs.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
